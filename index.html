<!DOCTYPE html>
<html>
<head>
    <title>Test PostMessage Application</title>
    <style>body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }</style>
</head>
<body>
    <h1>Test PostMessage Application</h1>
    <div id="status" style="padding: 10px; background: white; border: 1px solid #ccc;">
        메시지를 기다리는 중....
    </div>
    <button onclick="sendToParent()" style="margin-top: 10px;">Test postMessage()</button>

<p id="checkStatus">연결상태</p>
    <script>
        // 1. 부모로부터 메시지 수신
        window.addEventListener('message', (event) => {
            if(['react-devtools-content-script', 'react-devtools-hook-settings-injector', 'react-devtools-hook-installer'].includes(event.data.source)) return;
            const statusDiv = document.getElementById('status');
            
            if (event.data.type === 'SET_AUTH') {
                statusDiv.innerHTML = `<b>✅ 인증 완료!</b><br>Token: ${event.data.payload.AMTOKEN}`;
                statusDiv.style.background = '#e6fffa';
            } else {
                statusDiv.innerText = `📩 메시지 수신: ${JSON.stringify(event.data)}`;
            }
        });

        // 2. 부모에게 메시지 전송
        function sendToParent() {
document.getElementById('checkStatus').innerText=`check: ${window === window.parent} ${window === window.top}`
            window.parent.postMessage(
                { type: 'HELLO', payload: 'postMessage test...' },
                '*' // 테스트 시에는 '*' 사용, 운영 시에는 정확한 도메인
            );
        }
    </script>
</body>
</html>
